[package]
name = "lan-print"
version = "0.1.0"
edition = "2024"
description = "A local-first print and scan station for Windows, macOS and Linux"
license = "MIT"
default-run = "lan-print"
autobins = false
rust-version = "1.89"

[[bin]]
name = "lan-print"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "time", "fs", "sync", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Data_Pdf", "Storage", "Storage_Streams", "Foundation",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing",
  "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Console",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_WinRT"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
